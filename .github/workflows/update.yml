name: 更新資料並部署

on:
  schedule:
    # GitHub 排程使用 UTC，且常延遲甚至略過，因此每個時段設多個備援時間；
    # 同一時段已成功更新過，後續備援會自動略過（見 update_data.py 的 done_slots）
    # 午盤：台北 13:40、14:00、14:30、15:10
    - cron: "40 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "10 7 * * 1-5"
    # 晚間：台北 22:00、22:35、23:15、23:50
    - cron: "0 14 * * 1-5"
    - cron: "35 14 * * 1-5"
    - cron: "15 15 * * 1-5"
    - cron: "50 15 * * 1-5"
    # 個股基本面快取：台北 21:30（抓取約 5 分鐘，與一般更新分開，手動更新時不必等待）
    - cron: "30 13 * * 1-5"
    # 國際股市：台北 21:00～05:00、08:00～14:00 每半小時（分鐘取 05／35，與上方時段區隔；只更新國際行情）
    - cron: "5,35 13-20 * * *"
    - cron: "5 21 * * *"
    - cron: "5,35 0-5 * * *"
    - cron: "5 6 * * *"
  push:
    branches: [main]
    paths-ignore: ["state/**", "ledger/**", "site/data/intl.enc.json", "site/data/intl_list.enc.json", "site/data/instrank.enc.json", "site/data/home.enc.json", "site/data/quotes.enc.json", "site/data/watchlist.enc.json", "site/data/stocks.enc.json", "site/data/ohlc.enc.json"]
  workflow_dispatch:
    inputs:
      force:
        description: "不檢查是否開盤，強制更新"
        type: boolean
        default: false
      watchlist:
        description: "自選股清單（網頁加密後傳入，勿手動填寫）"
        type: string
        default: ""
      scheduled:
        description: "排程觸發（Google Apps Script 定時呼叫）：檢查開盤日並避免同時段重複更新"
        type: boolean
        default: false
      fund_only:
        description: "只更新個股基本面快取"
        type: boolean
        default: false
      intl:
        description: "國際股市：refresh＝只更新行情，或網頁加密後的清單（勿手動填寫）"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# 排隊規則改在各 job 設定：國際股市與台股資料分開排隊，部署另外排隊，彼此不會互相卡住

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: update-${{ ((inputs.intl || '') != '' || startsWith(github.event.schedule, '5,35 ') || startsWith(github.event.schedule, '5 ')) && 'intl' || 'main' }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      # 國際股市模式：網頁送出 intl 參數，或由國際股市排程（分鐘 05／35）觸發
      INTL_MODE: ${{ (inputs.intl || '') != '' || startsWith(github.event.schedule, '5,35 ') || startsWith(github.event.schedule, '5 ') }}
    steps:
      - name: 取消卡住超過 10 分鐘的執行（GitHub Pages 部署偶爾會卡在 waiting）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "${{ github.repository }}" --status waiting --json databaseId,createdAt             -q '.[] | select((now - (.createdAt | fromdateiso8601)) > 600) | .databaseId'             | xargs -r -I{} gh api -X POST "repos/${{ github.repository }}/actions/runs/{}/force-cancel" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: 國際股市行情
        if: env.INTL_MODE == 'true'
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          INTL_BLOB: ${{ inputs.intl }}
        run: python scripts/intl.py
      - name: 還原個股資料快取
        if: env.INTL_MODE != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: stock-cache-
      - name: 抓取資料
        if: env.INTL_MODE != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          DATA_KEY: ${{ secrets.DATA_KEY }}
          WATCHLIST_BLOB: ${{ inputs.watchlist }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 13 * * 1-5" ] || [ "${{ inputs.fund_only }}" = "true" ]; then
            python scripts/update_data.py --fund-only
          elif [ -n "$WATCHLIST_BLOB" ]; then
            python scripts/update_data.py --watch-only
          else
            python scripts/update_data.py ${{ inputs.force && '--force' || '' }}
          fi
      - name: 儲存個股資料快取
        if: always() && env.INTL_MODE != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: stock-cache-${{ github.run_id }}
      - name: 提交資料
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site/data
          if git diff --cached --quiet; then
            echo "資料無變動"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase -q origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # 資料無變動（例如國際股市休市時段）就不重新部署
    if: always() && (needs.update.result == 'skipped' || (needs.update.result == 'success' && needs.update.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: 還原個股資料快取
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: stock-cache-deploy-${{ github.run_id }}
          restore-keys: stock-cache-
      - name: 產生股票篩選資料庫與個股日K檔（不進 git）
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python scripts/market_db.py --build
      - name: 產生資料版本清單（網頁依版本讀取，避免 CDN 回傳舊資料）
        run: |
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          d = Path("site/data")
          files = {f.name[:-len(".enc.json")]: hashlib.sha1(f.read_bytes()).hexdigest()[:12]
                   for f in sorted(d.glob("*.enc.json"))}
          (d / "manifest.json").write_text(json.dumps({"built": int(time.time()), "files": files}), "utf-8")
          print(len(files), "files")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
