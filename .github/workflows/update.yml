name: 更新資料並部署

on:
  schedule:
    # GitHub 排程使用 UTC：05:35 UTC = 台北 13:35；14:00 UTC = 台北 22:00（週一至週五）
    - cron: "35 5 * * 1-5"
    - cron: "0 14 * * 1-5"
  push:
    branches: [main]
    paths-ignore: ["state/**", "site/data/home.enc.json", "site/data/quotes.enc.json", "site/data/watchlist.enc.json"]
  workflow_dispatch:
    inputs:
      force:
        description: "不檢查是否開盤，強制更新"
        type: boolean
        default: false
      watchlist:
        description: "自選股清單（網頁加密後傳入，勿手動填寫）"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 抓取資料
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          WATCHLIST_BLOB: ${{ inputs.watchlist }}
        run: |
          if [ -n "$WATCHLIST_BLOB" ]; then
            python scripts/update_data.py --watch-only
          else
            python scripts/update_data.py ${{ inputs.force && '--force' || '' }}
          fi
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site/data
          if git diff --cached --quiet; then
            echo "資料無變動"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
